  const parameterControl = target => {
    const control = target.closest?.('[data-action^="parameter-"]');

    return control && control.closest('.outputs') && !control.closest('[data-extension-id]') ? control : null;
  };

  function sendParameters(control, action, payload) {
    const cell = control.closest('[data-cell-id]')?.dataset.cellId;

    if (!cell) {
      return;
    }

    flushTyping();
    request('gesture', { cell, extensionId: Parameters, action, payload: JSON.stringify(payload) });
  }

  function openAddRow(control, open) {
    const form = control.closest('[data-cell-id]');
    const row = form?.querySelector('.verso-parameter-add-row');
    const add = form?.querySelector('[data-action="parameter-add"]');

    if (!row) {
      return;
    }

    if (open) {
      const table = row.closest('table');

      if (table) {
        table.style.display = '';
      }

      row.style.display = '';
      row.querySelector('.verso-add-name')?.focus();
    } else {
      row.style.display = 'none';

      for (const field of row.querySelectorAll('input[type=text]')) {
        field.value = '';
      }

      const required = row.querySelector('.verso-add-required');
      const type = row.querySelector('.verso-add-type');

      if (required) {
        required.checked = false;
      }

      if (type) {
        type.value = 'string';
      }
    }

    if (add) {
      add.style.display = open ? 'none' : '';
    }
  }

  document.addEventListener('click', event => {
    const control = parameterControl(event.target);

    if (!control) {
      return;
    }

    const row = control.closest('.verso-parameter-add-row');

    switch (control.getAttribute('data-action')) {
      case 'parameter-remove':
        sendParameters(control, 'parameter-remove', { name: control.getAttribute('data-param') });
        break;
      case 'parameter-add':
        openAddRow(control, true);
        break;
      case 'parameter-cancel-add':
        openAddRow(control, false);
        break;
      case 'parameter-confirm-add': {
        const name = (row?.querySelector('.verso-add-name')?.value ?? '').trim();

        if (!name) {
          row?.querySelector('.verso-add-name')?.focus();
          break;
        }

        sendParameters(control, 'parameter-add', {
          name,
          type: row.querySelector('.verso-add-type')?.value ?? 'string',
          description: row.querySelector('.verso-add-description')?.value ?? '',
          defaultValue: row.querySelector('.verso-add-default')?.value ?? '',
          required: row.querySelector('.verso-add-required')?.checked ?? false,
        });
        break;
      }
    }
  });

  // Enter in the new parameter's name adds it; Enter in a parameter's value sets it, as Verso's script lets it.
  document.addEventListener('keydown', event => {
    if (event.key !== 'Enter') {
      return;
    }

    const name = event.target.closest?.('.verso-parameter-add-row .verso-add-name');

    if (name && name.closest('.outputs')) {
      name.closest('.verso-parameter-add-row').querySelector('[data-action="parameter-confirm-add"]')?.click();

      return;
    }

    const control = parameterControl(event.target);

    if (control?.getAttribute('data-action') === 'parameter-update' && control.type !== 'checkbox') {
      event.preventDefault();
      sendParameters(control, 'parameter-update', { name: control.getAttribute('data-param'), value: control.value });
    }
  });

  document.addEventListener('change', event => {
    const control = parameterControl(event.target);
    const action = control?.getAttribute('data-action');

    if (action === 'parameter-update' || action === 'parameter-toggle-required') {
      sendParameters(control, action, {
        name: control.getAttribute('data-param'),
        value: control.type === 'checkbox' ? String(control.checked) : control.value,
      });
    }
  });

  // ---- The toolbar -------------------------------------------------------------------------------------------------

  let refreshTimer = 0;

  // The panel of the cell chosen says what the cell holds, and a change can change that: drawn again once changes settle.
  function refreshPanelSoon() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      if (state.openPanel === 'properties' && state.selected && state.cells.has(state.selected)) {
        loadPanel(state.selected);
      }
    }, 300);
  }

  // The engine's Run All.
  const RunAll = 'verso.action.run-all';

  // The buttons that only step through the layouts or the themes: Verso's editor leaves them off its toolbar, and switches
  // both in its View panel instead.
  const Cycling = new Set(['verso.switchLayout', 'verso.switchTheme']);

  // The toolbar, the export menu and every cell's bar, drawn from the buttons the last version carried. While a run is under
  // way the one Stop stands where the primary button stands, as Verso's toolbar swaps them, so no second run is pressed
  // there; else it stands beside the export menu, where the page's header has it.
  function drawToolbar() {
    const row = state.buttons.filter(button => button.place === Place.Main && !Cycling.has(button.id));
    const swapped = state.running !== null && row.some(button => button.isPrimary);

    toolbar.replaceChildren(...row.map(button => swapped && button.isPrimary ? stopButton : drawButton(button, [])));

    if (!swapped) {
      exportMenu.after(stopButton);
    }

    // As Verso's editor shows its export menu: what can be exported now, and no menu when nothing can.
    const exports = state.buttons.filter(button => button.place === Place.Export && button.isEnabled);

    exportMenu.hidden = exports.length === 0;
    exportMenu.querySelector('div').replaceChildren(...exports.map(button => drawButton(button, [])));

    for (const section of cellSections()) {
      const cell = state.cells.get(section.dataset.cellId);

      if (cell) {
        drawBar(section.querySelector('.cell-bar'), cell);
      }
    }
  }

  function drawButton(button, cells) {
    const element = document.createElement('button');

    element.type = 'button';
    element.dataset.button = button.id;

    // A cell's button is drawn only where it can be pressed; any other says whether it can be pressed now, and one whose
    // part could not say is not pressed, and says why.
    element.disabled = cells.length === 0 && !button.isEnabled;
    element.title = button.fault ? `${button.label} — it could not say whether it can be pressed: ${button.fault}` : button.label;

    if (button.icon?.trimStart().startsWith('<svg')) {
      element.innerHTML = DOMPurify.sanitize(button.icon, sanitizing);

      if (!button.iconOnly) {
        element.append(` ${button.label}`);
      }
    } else {
      element.textContent = button.label;
    }

    element.addEventListener('click', event => {
      event.stopPropagation();

      // As Verso's editor takes the choice away when its toolbar's Run All is pressed.
      if (button.id === RunAll) {
        deselect();
      }

      press(button, cells);
    });

    return element;
  }

  async function press(button, cells) {
    if (button.confirmation && !confirm(button.confirmation)) {
      return;
    }

    exportMenu.open = false;
    flushTyping();

    const file = await request('press', { button: button.id, cells });

    if (file) {
      download(file);
    }
  }

  // A file a button handed over is saved by this page alone, under the name it came with.
  function download(file) {
    const bytes = Uint8Array.from(atob(file.bytes), character => character.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: file.contentType }));
    const link = document.createElement('a');

    link.href = url;
    link.download = file.name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---- The panels beside the notebook, as Verso's editor has them ------------------------------------------------------

  const PanelNames = { metadata: 'Metadata', properties: 'Properties', view: 'View' };
  const PanelTitles = { metadata: 'Metadata', properties: 'Cell Properties', view: 'View' };

  // What is offered, in Verso's order: what the notebook says of itself, always; a cell's properties where the layout has
  // a panel for them; and the View panel — the engine this page serves always has Verso's own layouts and themes to
  // choose from.
  const offeredPanels = () => ['metadata', ...(state.panel ? ['properties'] : []), 'view'];

  // The toggles, each opening its panel or closing it; none is open at first, one at a time, and one no longer offered is
  // closed.
  function drawPanels() {
    const offered = offeredPanels();

    if (state.openPanel && !offered.includes(state.openPanel)) {
      state.openPanel = null;
    }

    panelsBar.replaceChildren(...offered.map(name => {
      const toggle = text('button', null, PanelNames[name]);

      toggle.type = 'button';
      toggle.dataset.panel = name;
      toggle.setAttribute('aria-pressed', String(state.openPanel === name));
      toggle.addEventListener('click', () => {
        state.openPanel = state.openPanel === name ? null : name;
        drawPanels();
      });

      return toggle;
    }));

    drawPanel();
  }

  // The open panel: its heading, a way to close it, and what it shows.
  function drawPanel() {
    if (!state.openPanel) {
      panel.replaceChildren();

      return;
    }

    const collapse = text('button', 'panel-collapse', '›');

    collapse.type = 'button';
    collapse.title = 'Collapse panel';
    collapse.setAttribute('aria-label', 'Collapse panel');
    collapse.addEventListener('click', () => {
      state.openPanel = null;
      drawPanels();
    });

    const body = element('div', 'panel-body');

    panel.replaceChildren(element('div', 'panel-head', [text('span', 'panel-title', PanelTitles[state.openPanel]), collapse]), body);

    if (state.openPanel === 'view') {
      drawView(body);
    } else if (state.openPanel === 'metadata') {
      drawMetadata(body);
    } else if (state.selected && state.cells.has(state.selected)) {
      loadPanel(state.selected, true);
    } else {
      body.append(text('p', 'empty', 'Select a cell to view its properties.'));
    }
  }

  // The View panel, as Verso's: the layouts, a read-only one said to be so, and the themes, the notebook's own marked.
  function drawView(body) {
    body.append(
      text('div', 'view-title', 'Layout'),
      ...state.layouts.map(layout => viewRow(
        layout.name,
        layout.id === state.layoutId,
        (layout.allows & Allows.Edit) === Allows.Edit ? null : 'Read only',
        row => { row.dataset.layout = layout.id; },
        () => request('layout', { layout: layout.id }))),
      text('div', 'view-title', 'Theme'),
      ...state.themes.map(theme => viewRow(
        theme.name,
        theme.id === state.themeId,
        null,
        row => { row.dataset.theme = theme.id; },
        () => request('theme', { theme: theme.id }))));
  }

  // The Metadata panel, as Verso's: the title, which a person changes here and which names what the notebook is exported
  // as; then what the notebook says of itself — the kernel a cell that names none runs in, its file, when it was made and
  // last saved, and the version of its format.
  function drawMetadata(body) {
    const title = document.createElement('input');

    title.type = 'text';
    title.placeholder = 'Untitled';
    title.dataset.meta = 'title';
    title.addEventListener('change', () => request('title', { title: title.value }));

    // A title looked at and left as it was shows what the notebook holds, which another tab may have changed meanwhile.
    title.addEventListener('focus', () => { title.dataset.shown = title.value; });
    title.addEventListener('blur', () => {
      if (title.value === title.dataset.shown) {
        showMetadata();
      }
    });

    const shown = name => {
      const value = element('span', 'meta-value');

      value.dataset.meta = name;

      return value;
    };

    const field = (label, value) => [text('label', null, label), value];

    body.append(
      ...field('Title', title),
      ...field('Default Kernel', shown('defaultKernel')),
      element('hr'),
      ...field('File', shown('file')),
      ...field('Created', shown('created')),
      ...field('Modified', shown('modified')),
      ...field('Format Version', shown('formatVersion')));
    showMetadata();
  }

  // What the notebook says of itself, where the Metadata panel shows it; a title being written stays the person's own.
  function showMetadata() {
    const body = state.openPanel === 'metadata' ? panel.querySelector('.panel-body') : null;

    if (!body || !state.metadata) {
      return;
    }

    const title = body.querySelector("[data-meta='title']");

    if (document.activeElement !== title) {
      title.value = state.metadata.title ?? '';
    }

    body.querySelector("[data-meta='defaultKernel']").textContent = kernelName(state.metadata.defaultKernel);
    body.querySelector("[data-meta='file']").textContent = state.name;
    body.querySelector("[data-meta='created']").textContent = dated(state.metadata.created);
    body.querySelector("[data-meta='modified']").textContent = dated(state.metadata.modified);
    body.querySelector("[data-meta='formatVersion']").textContent = state.metadata.formatVersion;
  }

  // Beside the notebook's name, as Verso's toolbar says it: the name cut short past twenty characters; its kernel, with how
  // many other languages its code cells are written in; and how many cells it has. The tip holds what the line holds back:
  // the whole name, and every kernel when there are several.
  const NameShown = 20;

  function showDocInfo() {
    if (!state.metadata) {
      return;
    }

    const name = state.name;
    const languages = [];

    for (const cell of state.order.map(id => state.cells.get(id))) {
      const language = cell?.type.toLowerCase() === 'code' ? cell.language ?? state.metadata.defaultKernel : null;

      if (language && !languages.some(each => each.toLowerCase() === language.toLowerCase())) {
        languages.push(language);
      }
    }

    const kernel = state.metadata.defaultKernel ? kernelName(state.metadata.defaultKernel) : 'No kernel';
    const cut = name.length > NameShown;
    const several = languages.length > 1;

    docInfo.querySelector('h1').textContent = cut ? `${name.slice(0, NameShown)}…` : name;
    docInfo.querySelector('.meta').textContent = `${several ? `${kernel} +${languages.length - 1}` : kernel} · ${counted(state.order.length, 'cell', 'cells')}`;
    docInfo.title = cut || several ? [name, ...(several ? [`Kernels: ${languages.map(kernelName).join(', ')}`] : [])].join('\n') : '';
  }

  // A kernel by the name the notebook's kinds give its language, as Verso's panel lists it; one it has no kernel for, by
  // its id.
  const kernelName = id => id
    ? state.kinds.find(kind => kind.type === 'code' && kind.language?.toLowerCase() === id.toLowerCase())?.name ?? id
    : '—';

  // A moment as Verso's panel writes it, in the offset it was kept with: the day, then hours and minutes.
  const dated = moment => moment ? `${moment.slice(0, 10)} ${moment.slice(11, 16)}` : '—';

  function viewRow(name, chosen, chip, mark, choose) {
    const row = element('div', 'view-row', [
      text('span', 'name', name),
      ...(chip ? [text('span', 'chip', chip)] : []),
      ...(chosen ? [text('span', 'check', '✓')] : []),
    ]);

    mark(row);
    row.tabIndex = 0;
    row.setAttribute('role', 'button');
    row.setAttribute('aria-pressed', String(chosen));

    const pick = () => {
      if (!chosen) {
        choose();
      }
    };

    row.addEventListener('click', pick);
    row.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        pick();
      }
    });

    return row;
  }

  // What a theme's tone draws on: the page's own colours taken from the theme's tokens.
  const Tone = { Light: 0, Dark: 1, HighContrast: 2 };
  const ThemeColours = [
    '--ground: var(--verso-bg-default)', '--paper: var(--verso-cell-background)', '--ink: var(--verso-fg-default)',
    '--quiet: var(--verso-fg-muted)', '--line: var(--verso-border-default)', '--accent: var(--verso-accent-primary)',
    '--wrong: var(--verso-status-error)', '--run: var(--verso-status-success)', '--warn: var(--verso-status-warning)',
    '--pick: var(--verso-highlight-background)',
  ].join('; ');

  // The theme the notebook chose, drawn as Verso's surfaces draw one — its tokens, the page's colours taken from them —
  // and while it chose none, the page's own look. Nothing of it is kept in the browser.
  function themeIs(id) {
    if ((id ?? null) === state.themeId) {
      return;
    }

    state.themeId = id ?? null;

    const theme = state.themes.find(each => each.id === state.themeId);

    themeStyle.textContent = theme
      ? `${theme.css}\n:root { ${ThemeColours}; color-scheme: ${theme.tone === Tone.Light ? 'light' : 'dark'}; }`
      : '';

    for (const frame of document.querySelectorAll('iframe.widget')) {
      frame.contentWindow?.postMessage({ type: 'verso/widget-theme', ...themeAt(frame) }, '*');
    }

    if (state.openPanel === 'view') {
      drawPanel();
    }
  }

  // As Verso's cell list takes the choice away: a click on the list, beside every cell — pressed there as well as let go
  // there, since a cell chosen as it is pressed moves the cells under the pointer before it is let go.
  let pressedBeside = false;

  main.addEventListener('pointerdown', event => {
    pressedBeside = !event.target.closest('section.cell');
  });
  main.addEventListener('click', event => {
    if (pressedBeside && state.name && state.selected !== null && !event.target.closest('section.cell')) {
      deselect();
    }
  });

  // The first cell not shown rendered, chosen; none when every cell is.
  function chooseFirst() {
    const first = state.order.find(id => !shownRendered(state.cells.get(id)));

    if (first) {
      select(first);
    }
  }

  // No cell is selected: the one that was is drawn again, and the properties panel says so.
  function deselect() {
    const before = state.selected;
    const cell = before ? state.cells.get(before) : undefined;

    state.selected = null;

    if (cell && sectionOf(before)) {
      fill(sectionOf(before), cell);
    }

    if (state.openPanel === 'properties') {
      drawPanel();
    }
  }

  function select(id) {
    const before = state.selected;

    state.selected = id;

    for (const section of cellSections()) {
      const cell = state.cells.get(section.dataset.cellId);

      if (cell && (cell.id === before || cell.id === id)) {
        fill(section, cell);
      }
    }

    // As Verso's panel reads a cell's properties: when another cell is chosen, not again for the same one.
    if (id !== before) {
      loadPanel(id, true);
    }
  }

  // A cell's properties, drawn in the properties panel while it is open, as Verso's panel draws them: while another cell's
  // are read it says so, and the fields of the cell chosen before go at once, so nothing is changed on a cell no longer
  // chosen; a cell that has none, or whose properties could not be read, is said to have none. Read again for the same
  // cell, its fields stay until the new ones come.
  async function loadPanel(id, fresh = false) {
    if (state.openPanel !== 'properties' || !state.panel) {
      return;
    }

    if (fresh) {
      panel.querySelector('.panel-body')?.replaceChildren(text('p', 'empty', 'Loading...'));
    }

    let sections;

    try {
      sections = await ask('properties', { cell: id });
    } catch {
      sections = [];
    }

    const body = panel.querySelector('.panel-body');

    if (state.selected !== id || state.openPanel !== 'properties' || !body) {
      return;
    }

    body.replaceChildren(...(sections.length === 0
      ? [text('p', 'empty', 'No properties available for this cell.')]
      : sections.flatMap(section => drawSection(id, section))));
  }

  function drawSection(id, section) {
    const title = document.createElement('h3');

    title.textContent = section.title;

    const drawn = [title];

    if (section.description) {
      const words = document.createElement('p');

      words.textContent = section.description;
      drawn.push(words);
    }

    // As Verso's panel draws a field: its label, what it is said to be under it, and the field.
    for (const field of section.fields) {
      drawn.push(text('label', null, field.label), ...(field.description ? [text('div', 'field-description', field.description)] : []), drawField(id, section.part, field));
    }

    return drawn;
  }

  function drawField(id, part, field) {
    let input;

    switch (field.kind) {
      case Kind.Toggle:
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = switchedOn(field.value);
        break;
      case Kind.Select:
        input = document.createElement('select');
        input.append(...field.options.map(option => new Option(option.label, option.value, false, sameWord(field.value, option.value))));
        break;
      case Kind.Several:
        return drawSeveral(id, part, field);
      case Kind.Number:
        input = document.createElement('input');
        input.type = 'number';
        input.value = field.value ?? '';
        break;
      case Kind.Colour:
        input = document.createElement('input');
        input.type = 'color';
        input.value = field.value ?? '#000000';
        break;
      default:
        input = document.createElement('input');
        input.type = 'text';
        input.value = Array.isArray(field.value) ? field.value.join(', ') : (field.value ?? '');
        break;
    }

    input.dataset.part = part;
    input.dataset.field = field.name;
    input.disabled = field.isReadOnly;
    input.addEventListener('change', () => change(id, part, field.name, valueOf(field.kind, input)));

    return input;
  }

  // As Verso's panel reads a field's value: a switch is on when it is true, or the word true in any case; a choice is the
  // one whose value is the field's in any case; several choices are a list, or one line of words parted by commas.
  const switchedOn = value => value === true || typeof value === 'string' && value.trim().toLowerCase() === 'true';
  const sameWord = (value, word) => value !== null && value !== undefined && String(value).toLowerCase() === String(word).toLowerCase();
  const wordsOf = value => Array.isArray(value)
    ? value.map(String)
    : String(value ?? '').split(',').map(word => word.trim()).filter(word => word);

  // Several choices: a box for each, ticked for a choice among the field's words in any case; a box changed sends the
  // field's words with that one choice added or taken away, as Verso's panel sends them — a word not among the choices
  // is kept.
  function drawSeveral(id, part, field) {
    const words = wordsOf(field.value);
    const group = document.createElement('div');

    group.dataset.part = part;
    group.dataset.field = field.name;

    for (const option of field.options) {
      const label = document.createElement('label');
      const box = document.createElement('input');

      box.type = 'checkbox';
      box.value = option.value;
      box.checked = words.some(word => sameWord(word, option.value));
      box.disabled = field.isReadOnly;
      box.addEventListener('change', () => {
        const now = [...words];
        const at = now.indexOf(option.value);

        if (box.checked && at < 0) {
          now.push(option.value);
        } else if (!box.checked && at >= 0) {
          now.splice(at, 1);
        }

        change(id, part, field.name, now);
      });
      label.append(box, ` ${option.label}`);
      group.append(label);
    }

    return group;
  }

  // A field's value in the form its kind has in JSON, which the part reads as Verso's own editors hand it on.
  function valueOf(kind, input) {
    switch (kind) {
      case Kind.Toggle:
        return input.checked;
      // As Verso's panel sends a number: as a number when it is written as one, else as the text it is.
      case Kind.Number:
        return input.value.trim() !== '' && Number.isFinite(Number(input.value)) ? Number(input.value) : input.value;
      case Kind.Words:
        return input.value.split(',').map(word => word.trim()).filter(word => word);
      default:
        return input.value;
    }
  }

  async function change(id, part, field, value) {
    flushTyping();
    await request('property', { cell: id, part, field, value });
    await loadPanel(id);
  }

  // ---- Saving and closing ------------------------------------------------------------------------------------------

  // As Verso's editor saves: an error said before is cleared as the save begins, and a save done is a notice naming the
  // file. Saved says nothing back: a save that was refused has said why.
  async function save() {
    flushTyping();
    dismiss();

    if (await request('save') === null) {
      notice(`Saved to ${state.name}`);
    }
  }

  saveButton.addEventListener('click', save);
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key === 's' && state.name) {
      event.preventDefault();
      save();
    }
  });

  // A close goes past everything asked before it, as a stop does: what waits may be waiting for the very run it stops. It
  // asks first only when something would be lost: what is not saved — typing not sent yet, or a change not answered yet,
  // among it — or the run under way.
  closeButton.addEventListener('click', async () => {
    const unsaved = state.unsaved || typed.size > 0 || unanswered > 0;
    const lost = [
      ...(unsaved ? ['What is not saved is lost.'] : []),
      ...(state.running === null ? [] : ['The run under way is stopped; code that does not stop goes on in the background until the tool stops.']),
    ];

    if (lost.length > 0 && !confirm(`Close the notebook${unsaved ? ' without saving it' : ''}? ${lost.join(' ')}`)) {
      return;
    }

    // Nothing is asked after it, the panel is not drawn again, and the socket the close ends is not opened again: each
    // would open the closed notebook again.
    closed = true;
    clearTimeout(refreshTimer);

    try {
      await ask('close');
      location.search = '';
    } catch (error) {
      fail(error.message);
    }
  });

  // ---- Begin -------------------------------------------------------------------------------------------------------

  const named = address.get('notebook');

  if (named) {
    open(named);
  } else {
    list().catch(error => fail(error.message));
  }
})();
</script>
</body>
</html>

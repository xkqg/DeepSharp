<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSharp</title>
<!-- The page's icon is its own, as everything it draws is: a browser asks the server for none. -->
<link rel="icon" href="data:,">
<style>
  :root {
    --ground: #fbfbfa; --paper: #ffffff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #deddd8;
    --accent: #2458a6; --wrong: #b3261e; --run: #2e7d32; --pick: #eef3fb; --warn: #9a6700;
    --json-string: #a31515; --json-number: #098658; --json-boolean: #0000ff;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    /* The theme a widget's document may read, named as Verso's pages name it, from this page's own colours. */
    --verso-cell-output-background: var(--paper); --verso-cell-output-foreground: var(--ink); --verso-border-default: var(--line);
    --verso-bg-default: var(--ground); --verso-fg-default: var(--ink); --verso-fg-muted: var(--quiet); --verso-accent-primary: var(--accent);
    --verso-ui-font-family: system-ui, -apple-system, "Segoe UI", sans-serif; --verso-ui-font-size: 14px; --verso-font-family-mono: var(--mono);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #151514; --paper: #1d1d1b; --ink: #ecebe6; --quiet: #a3a29c; --line: #34332f; --accent: #8ab4f8; --wrong: #f2b8b5; --run: #81c995; --pick: #1f2a3a; --warn: #e3b341; --json-string: #ce9178; --json-number: #b5cea8; --json-boolean: #569cd6; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--ground); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .5rem 1rem; background: var(--paper); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0; }
  #doc-info { display: flex; flex-direction: column; margin-right: 1rem; }
  #doc-info .meta { font-size: .75rem; color: var(--quiet); }
  #doc-info .meta:empty { display: none; }
  header .spacer { flex: 1; }
  button { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: .2rem .6rem; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button svg { width: 1em; height: 1em; vertical-align: -.125em; }
  details { position: relative; }
  details > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 4px; padding: .2rem .6rem; }
  details > div { position: absolute; right: 0; top: 2rem; display: flex; flex-direction: column; gap: .25rem; padding: .5rem; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; min-width: 14rem; }
  #status, #notice { color: var(--quiet); }
  #error { flex-basis: 100%; display: flex; gap: .75rem; align-items: center; padding: .35rem .75rem; border: 1px solid var(--wrong); border-radius: 4px; background: color-mix(in srgb, var(--wrong) 10%, var(--paper)); color: var(--wrong); }
  #error[hidden] { display: none; }
  #error .text { flex: 1; }
  .kernel { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 7.5rem; padding: 3px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .kernel[hidden] { display: none; }
  .kernel .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .kernel.idle { color: var(--run); background: color-mix(in srgb, var(--run) 10%, transparent); }
  .kernel.running { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .kernel.running .dot { animation: pulse 1s ease-in-out infinite; }
  .kernel.restarting { color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .kernel.error { color: var(--wrong); background: color-mix(in srgb, var(--wrong) 10%, transparent); }
  @keyframes pulse { 50% { opacity: .3; } }
  #save .unsaved { display: inline-block; width: 6px; height: 6px; margin-left: .35rem; border-radius: 50%; background: var(--accent); vertical-align: middle; }
  #save .unsaved[hidden] { display: none; }
  .layout { display: flex; align-items: flex-start; }
  .column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  main { padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
  aside#panel { width: 22rem; max-width: 40vw; position: sticky; top: 3rem; max-height: calc(100vh - 3rem); overflow: auto; padding: 1rem; border-left: 1px solid var(--line); }
  aside#panel:empty { display: none; }
  aside#panel h3 { font-size: .95rem; margin: .75rem 0 .25rem; }
  aside#panel .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
  aside#panel .panel-title { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--quiet); }
  aside#panel .panel-collapse { border: 0; background: none; font-size: 1.1rem; line-height: 1; }
  aside#panel .empty { color: var(--quiet); }
  aside#panel .view-title { margin: .75rem 0 .25rem; font-size: .8rem; font-weight: 600; color: var(--quiet); }
  aside#panel .view-row { display: flex; align-items: center; gap: .5rem; padding: .3rem .5rem; border-radius: 4px; cursor: pointer; }
  aside#panel .view-row:hover, aside#panel .view-row:focus-visible { background: var(--pick); }
  aside#panel .view-row[aria-pressed=true] { font-weight: 600; }
  aside#panel .view-row .chip { font-size: .75rem; padding: 0 .4rem; border: 1px solid var(--line); border-radius: 999px; color: var(--quiet); font-weight: 400; }
  aside#panel .view-row .check { margin-left: auto; color: var(--accent); }
  #panels { display: inline-flex; gap: .25rem; }
  #panels button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  aside#panel label { display: block; margin: .5rem 0 .15rem; color: var(--quiet); }
  aside#panel .field-description { margin: 0 0 .25rem; font-size: .85em; color: var(--quiet); }
  aside#panel input[type=text], aside#panel input[type=number], aside#panel select { width: 100%; }
  aside#panel .meta-value { display: block; }
  aside#panel hr { border: 0; border-top: 1px solid var(--line); margin: .75rem 0; }
  section.cell { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
  section.cell.selected { border-color: var(--accent); }
  section.cell.running { border-color: var(--run); }
  .cell-bar { display: flex; gap: .4rem; align-items: center; padding: .3rem .5rem; border-bottom: 1px solid var(--line); cursor: pointer; }
  .cell-bar .kind { color: var(--quiet); font-size: .85em; }
  .cell-bar select.kind { font: inherit; font-size: .85em; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
  .cell-bar button.delete:hover:not(:disabled) { border-color: var(--wrong); color: var(--wrong); }
  .cell-bar button.fold { border: 0; background: none; padding: .2rem .3rem; }
  .cell-bar button.fold .chevron { display: inline-block; font-size: 9px; transition: transform .15s ease; }
  .cell-bar button.fold.folded .chevron { transform: rotate(-90deg); }
  .source-preview { padding: .5rem .75rem; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 94%, var(--quiet)); cursor: pointer; }
  .source-preview[hidden] { display: none; }
  .source-preview pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 var(--mono); }
  section.cell.unsent { border-color: var(--warn); border-style: dashed; }
  section.cell.unsent .cell-bar .status::after { content: " not sent yet"; color: var(--warn); }
  .insert-row, .add-row { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
  .insert-row { display: none; padding: .3rem .5rem; border-top: 1px dashed var(--line); }
  section.cell.selected .insert-row { display: flex; }
  section.cell:last-of-type .insert-row { display: none; }
  section.cell:first-of-type .cell-bar button.up, section.cell:last-of-type .cell-bar button.down { visibility: hidden; }
  .add-row { padding: 0 1rem 1rem; }
  .add-row[hidden] { display: none; }
  textarea.source[readonly] { color: var(--quiet); }
  ul.completions { list-style: none; margin: 0; padding: .2rem 0; max-height: 12rem; overflow: auto; border-bottom: 1px solid var(--line); font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  ul.completions li { padding: .1rem .6rem; cursor: pointer; }
  ul.completions li.active { background: var(--pick); }
  .hover-line { padding: .2rem .5rem; color: var(--quiet); font-size: .85em; border-bottom: 1px solid var(--line); }
  .hover-line:empty { display: none; }
  .cell-bar .status { margin-left: auto; color: var(--quiet); font-size: .85em; }
  section.cell.running .cell-bar .status::before { content: "running… "; color: var(--run); }
  section.cell.waiting { border-color: var(--run); border-style: dashed; }
  section.cell.waiting .cell-bar .status::before { content: "waits for another notebook's C# run to end… "; color: var(--run); }
  textarea.source { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: .5rem; font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; background: transparent; color: inherit; resize: vertical; }
  textarea.source[hidden] { display: none; }
  .outputs { padding: .5rem; overflow: auto; }
  .outputs:empty { display: none; }
  /* Cut short as Verso's editor cuts what a cell shows: each text and each failure to the lines the cell keeps, whatever
     is drawn as a page to 160 pixels; standard error, progress and widgets are never cut. */
  .outputs.preview > pre.text, .outputs.preview .error-content, .outputs.preview .error-stack { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 5); overflow: hidden; }
  .outputs.preview > :is(.html, .json, .csv-frame, .mermaid-container) { max-height: 160px; overflow: hidden; }
  .output-summary { margin: .5rem; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--quiet); font-size: 12px; }
  .output-summary[hidden] { display: none; }
  .outputs pre { margin: 0; white-space: pre-wrap; font: 13px/1.4 var(--mono); }
  .outputs img { max-width: 100%; }
  .outputs .error { background: color-mix(in srgb, var(--wrong) 12%, var(--paper)); color: var(--wrong); padding: .5rem; }
  .outputs .error-name { font-weight: 700; margin-bottom: 4px; }
  .outputs .error-content { word-break: break-word; }
  .outputs .error-stack { margin-top: 4px; word-break: break-word; font-size: 11px; opacity: .75; }
  .outputs .stderr { padding: .5rem; border-left: 3px solid var(--warn); }
  .outputs .stderr-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .75; margin-bottom: 2px; }
  .outputs .progress { padding: .5rem; }
  .outputs .progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; margin-bottom: 4px; }
  .outputs .progress-status { opacity: .7; }
  .outputs .progress-track { height: 6px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--quiet) 25%, transparent); }
  .outputs .progress-fill { height: 100%; background: var(--run); transition: width 120ms linear; }
  .outputs .progress-fill.unknown { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .outputs .progress-fill { transition: none; }
    .outputs .progress-fill.unknown { animation: none; width: 100%; opacity: .4; }
  }
  .outputs .json { font: 13px/1.5 var(--mono); }
  .outputs .json details { margin-left: 16px; }
  .outputs .json summary { cursor: pointer; list-style: none; user-select: none; }
  .outputs .json summary::-webkit-details-marker { display: none; }
  .outputs .json summary::before { content: "\25B6"; font-size: 9px; margin-right: 4px; color: var(--quiet); display: inline-block; transition: transform .1s; }
  .outputs .json details[open] > summary::before { transform: rotate(90deg); }
  .outputs .json .jk { color: var(--accent); }
  .outputs .json .js { color: var(--json-string); }
  .outputs .json .jn { color: var(--json-number); }
  .outputs .json .jb { color: var(--json-boolean); }
  .outputs .json .jnull { color: var(--quiet); font-style: italic; }
  .outputs .json .jcount { opacity: .7; }
  .outputs .csv-frame { max-height: 400px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; }
  .outputs table.csv { border-collapse: collapse; width: 100%; font: 13px var(--mono); }
  .outputs table.csv th { padding: 6px 12px; text-align: left; white-space: nowrap; background: var(--ground); border: 1px solid var(--line); font-weight: 600; }
  .outputs table.csv td { padding: 4px 12px; border: 1px solid var(--line); white-space: nowrap; }
  .outputs table.csv tr:hover td { background: var(--pick); }
  .outputs iframe.widget { width: 100%; border: 0; display: block; opacity: .68; filter: saturate(.5); }
  .outputs .widget-inert { margin: 2px 0 0; font-size: .8125rem; color: var(--quiet); }
  /* What a layout draws of its own — Verso's dashboard, its presentation — styled as Verso's editors style it: each cell
     placed in the slot that names it shows only what it shows. Colours are the notebook's theme's where it chose one, and
     the page's own otherwise. */
  #arrangement[hidden], main[hidden] { display: none; }
  #arrangement .verso-dashboard-root { display: flex; flex-direction: column; }
  #arrangement .verso-dashboard-grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 50px; gap: var(--verso-cell-gap, 8px); padding: var(--verso-content-margin-vertical, 16px) var(--verso-content-margin-horizontal, 24px); align-content: start; }
  #arrangement .verso-dashboard-cell { position: relative; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--verso-cell-border, var(--line)); border-radius: var(--verso-cell-border-radius, 6px); background: var(--verso-cell-background, var(--paper)); box-shadow: var(--verso-elevation-1, 0 1px 3px rgba(0, 0, 0, .08)); transition: box-shadow .15s, border-color .15s; }
  #arrangement .verso-dashboard-cell:hover { border-color: var(--verso-cell-active-border, var(--accent)); box-shadow: var(--verso-elevation-2, 0 2px 8px rgba(0, 0, 0, .12)); }
  #arrangement .verso-dashboard-cell-toolbar { display: flex; flex-shrink: 0; align-items: center; gap: 4px; padding: 4px 8px; background: var(--verso-toolbar-background, var(--ground)); border-bottom: 1px solid var(--verso-cell-border, var(--line)); opacity: 0; transition: opacity .15s; }
  #arrangement .verso-dashboard-cell:hover .verso-dashboard-cell-toolbar, #arrangement .verso-dashboard-cell:focus-within .verso-dashboard-cell-toolbar { opacity: 1; }
  #arrangement .verso-dashboard-drag-handle { cursor: grab; }
  #arrangement .verso-dashboard-drag-handle:active { cursor: grabbing; }
  #arrangement .verso-dashboard-drag-icon { margin-left: auto; color: var(--quiet); font-size: 14px; user-select: none; }
  #arrangement .verso-dashboard-resize-handle { position: absolute; right: 0; bottom: 0; z-index: 2; width: 20px; height: 20px; cursor: se-resize; opacity: 0; transition: opacity .15s; }
  #arrangement .verso-dashboard-resize-handle::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 10px; height: 10px; border-right: 2px solid var(--quiet); border-bottom: 2px solid var(--quiet); }
  #arrangement .verso-dashboard-cell:hover .verso-dashboard-resize-handle { opacity: 1; }
  #arrangement .verso-dashboard-cell.verso-resizing { z-index: 10; opacity: .7; }
  #arrangement .verso-dashboard-cell.verso-dragging { opacity: .3; }
  #arrangement .verso-dashboard-cell > section.cell { flex: 1; min-height: 0; overflow: auto; }
  .tile-ghost { position: fixed; z-index: 1000; pointer-events: none; border: 2px dashed var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .tile-size { position: fixed; z-index: 1001; pointer-events: none; padding: 2px 8px; border-radius: 3px; background: var(--accent); color: var(--paper); font: 11px var(--mono); }
  .tile-place { pointer-events: none; border: 2px dashed var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #arrangement .verso-presentation-view { max-width: 960px; margin: 0 auto; padding: 24px 12px; }
  #arrangement .verso-presentation-cell { margin-bottom: 16px; }
  #arrangement .verso-presentation-input { margin: 0 0 8px; padding: 8px 12px; border: 1px solid var(--verso-cell-border, var(--line)); border-radius: 4px; background: var(--verso-editor-background, var(--ground)); }
  #arrangement .verso-presentation-input pre { margin: 0; white-space: pre-wrap; font: 13px/1.4 var(--mono); }
  #arrangement [data-cell-slot] section.cell { border: 0; border-radius: 0; background: transparent; }
  #arrangement [data-cell-slot] section.cell > :is(.cell-bar, textarea.source, .source-preview, .hover-line, .insert-row, ul.completions) { display: none; }
  #notebooks { list-style: none; padding: 0; margin: 2rem auto; max-width: 40rem; }
  #notebooks li { padding: .4rem 0; border-bottom: 1px solid var(--line); }
  #notebooks a { color: var(--accent); text-decoration: none; }
  #new { display: flex; gap: .5rem; max-width: 40rem; margin: 0 auto; }
  #new input { flex: 1; font: inherit; }
</style>
<style id="notebook-theme"></style>
</head>
<body>
<header>
  <div id="doc-info"><h1 id="notebook-name">DeepSharp</h1><span class="meta"></span></div>
  <span id="kernel" class="kernel idle" hidden><span class="dot"></span><span class="text">Kernel idle</span></span>
  <span id="toolbar"></span>
  <details id="export" hidden><summary>Export</summary><div></div></details>
  <button id="stop" hidden title="Stop the run under way: its kernel starts afresh">Stop</button>
  <span class="spacer"></span>
  <span id="notice" role="status" aria-live="polite"></span>
  <span id="status" role="status" aria-live="polite"></span>
  <button id="save" hidden title="Save the notebook to its file (Ctrl+S)">Save<span class="unsaved" hidden aria-hidden="true"></span></button>
  <button id="close" hidden title="Close the notebook without saving it">Close</button>
  <span id="panels"></span>
  <div id="error" role="alert" hidden><span class="text"></span><button type="button" class="dismiss">Dismiss</button></div>
</header>
<div class="layout">
  <div class="column">
    <div id="arrangement" hidden></div>
    <main id="notebook"></main>
    <div id="adding" class="add-row" hidden></div>
  </div>
  <aside id="panel" aria-label="Panel"></aside>
</div>
<!-- What the page draws diagrams and formulas with: Mermaid 11.17.2 and KaTeX 0.18.9, both under the MIT licence
     (THIRD-PARTY-NOTICES.txt beside the tool), carried here by the server and run only once one first shows. -->
<!-- carried -->
<script>
'use strict';
(() => {
  // What the address said: the token is in the cookie the server set with this page, so the address loses it.
  const address = new URLSearchParams(location.search);

  if (address.has('token')) {
    address.delete('token');
    history.replaceState(null, '', location.pathname + (address.toString() ? `?${address}` : ''));
  }

  const main = document.getElementById('notebook');
  const arrangement = document.getElementById('arrangement');
  const panel = document.getElementById('panel');
  const panelsBar = document.getElementById('panels');
  const themeStyle = document.getElementById('notebook-theme');
  const docInfo = document.getElementById('doc-info');
  const statusLine = document.getElementById('status');
  const noticeLine = document.getElementById('notice');
  const errorBanner = document.getElementById('error');
  const stopButton = document.getElementById('stop');
  const saveButton = document.getElementById('save');
  const unsavedDot = saveButton.querySelector('.unsaved');
  const kernelStatus = document.getElementById('kernel');
  const closeButton = document.getElementById('close');
  const exportMenu = document.getElementById('export');
  const toolbar = document.getElementById('toolbar');
  const adding = document.getElementById('adding');

  // What a toolbar button's place and a panel field's kind are called in the server's answers.
  const Place = { Main: 0, Cell: 1, Menu: 2, Export: 3 };

  // Verso's editor runs a cell from the button of its own on the cell's bar, and leaves the engine's Run Cell off it.
  const RunFromTheBar = new Set(['verso.action.run-cell']);
  const Kind = { Text: 0, Number: 1, Toggle: 2, Select: 3, Several: 4, Colour: 5, Words: 6 };

  // What the notebook's layout lets a person do to its cells, as the server's versions say it.
  const Allows = { Insert: 1, Delete: 2, Reorder: 4, Edit: 8, Execute: 32 };

  const state = {
    name: null, cells: new Map(), running: null, executing: [], kernels: null, unsaved: false, selected: null, buttons: [], kinds: [], allows: 255,
    panel: true, focus: null, drawn: new Set(), layouts: [], themes: [], layoutId: null, themeId: null, openPanel: null,
    order: [], arrangement: null, metadata: null,
  };

  const allowed = flag => (state.allows & flag) === flag;

  // The kinds a cell can be, as the notebook lists them; a cell of a kind it does not list is written as it is.
  const kindKey = (type, language) => `${type}|${language ?? ''}`;
  const kindOf = cell => state.kinds.find(kind => kindKey(kind.type, kind.language) === kindKey(cell.type, cell.language));

  // A cell of a kind shown rendered once it has run — Markdown, HTML, Mermaid — as the engine says of its kinds.
  const renderedKind = cell => kindOf(cell)?.rendered === true;

  // The cell a person chose, kept whatever layout the notebook is shown in, and the cell drawn chosen: none in a layout
  // that lets nothing be edited, as Verso's editor hands its cells no choice there, so a cell shown rendered stays shown.
  const chosen = () => allowed(Allows.Edit) ? state.selected : null;

  // As Verso's editor shows such a cell: rendered, in place of its text, once it has text and output and is not chosen;
  // while chosen, its text stands in for its rendering.
  const shownRendered = cell => renderedKind(cell) && cell.outputs.length > 0 && cell.source.trim() !== '';
  const previewOf = cell => shownRendered(cell) && chosen() !== cell.id;

  // What the page says, kept apart as Verso's editor keeps it: a notice, gone after three seconds, a newer one starting the
  // three again; a sentence that stands while what it says holds, one for each thing the page tells of; and an error, in a
  // banner of its own, kept until it is dismissed or another takes its place.
  let noticeTimer = 0;
  const held = new Map();

  function notice(message) {
    clearTimeout(noticeTimer);
    noticeLine.textContent = message;
    noticeTimer = setTimeout(() => {
      noticeLine.textContent = '';
    }, 3000);
  }

  function hold(about, sentence) {
    if (sentence) {
      held.set(about, sentence);
    } else {
      held.delete(about);
    }

    statusLine.textContent = [...held.values()].join(' ');
  }

  function fail(message) {
    errorBanner.querySelector('.text').textContent = message;
    errorBanner.hidden = false;
  }

  function dismiss() {
    errorBanner.hidden = true;
    errorBanner.querySelector('.text').textContent = '';
  }

  errorBanner.querySelector('.dismiss').addEventListener('click', dismiss);

  const notebookPath = (tail = '') => `/api/notebooks/${encodeURIComponent(state.name)}${tail}`;

  // What is asked of the server over HTTP — the notebooks of the folder, a new one: a refusal comes back as what it says.
  async function api(path, options = {}) {
    const init = { method: options.method ?? 'GET', headers: {} };

    if (options.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(options.body);
    }

    const response = await fetch(path, init);

    if (!response.ok) {
      let message = `${response.status} ${response.statusText}`;

      try {
        message = (await response.json()).message ?? message;
      } catch {
        // The answer had no words of its own.
      }

      throw new Error(message);
    }

    return response;
  }

  const json = async (path, options) => (await api(path, options)).json();

  // ---- The notebook's socket: the page's one connection to its notebook -------------------------------------------

  // The socket while there is one, and every ask sent on it and not answered yet, by its id.
  let socket = null;
  let asks = 0;
  const pending = new Map();

  // How many times in a row the socket was opened again; one that draws the notebook starts the count afresh.
  let retries = 0;

  // Once the notebook is closed from this page, nothing is sent and its socket is not opened again: each would open the
  // closed notebook again. A page that goes away opens none either, until it is shown again.
  let closed = false;
  let leaving = false;

  // Until the notebook's first frame is drawn.
  let opening = true;

  // Opens the notebook's socket, as Verso's editor holds one connection per tab: its first frame draws the notebook
  // whole, each change after it is drawn as it comes, and each answer settles the ask it names. A socket that ends is
  // opened again, and the notebook drawn whole from its first frame — what changed meanwhile was never told, and a
  // notebook opened afresh counts its versions from the start — unless this page closed the notebook or went away, or
  // the server refused the notebook, saying why.
  function connect() {
    const opening = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${notebookPath('/socket')}`);

    socket = opening;
    opening.addEventListener('message', event => told(JSON.parse(event.data)));
    opening.addEventListener('close', event => {
      if (socket !== opening) {
        return;
      }

      socket = null;

      for (const each of pending.values()) {
        each.reject(new Error('The connection to the server went before this was answered; it may or may not have been done.'));
      }

      pending.clear();

      if (closed || leaving || event.code >= 4000) {
        return;
      }

      // As G18 has it: what the notebook holds unsaved is lost if the server has stopped, which the page cannot tell from a
      // connection that went.
      hold('connection', event.code === 1000 ? 'The notebook was closed; it is opened again…' : `Reconnecting…${state.unsaved ? ` ${LostAtStop}` : ''}`);
      setTimeout(connect, Math.min(5000, 250 * 2 ** retries++));
    });
  }

  function told(frame) {
    switch (frame.type) {
      case 'snapshot':
        retries = 0;
        state.kinds = frame.kinds;
        state.layouts = frame.layouts ?? [];
        state.themes = frame.themes ?? [];
        hold('connection', null);
        drawAll(frame.version);

        // As Verso's editor chooses as a notebook opens: the first cell not shown rendered — on this page's first frame of
        // the notebook alone, since a socket opened again keeps what the person chose.
        if (opening) {
          opening = false;
          chooseFirst();
        }

        flushTyping();
        break;
      case 'change':
        apply(frame.change);
        break;
      case 'answer':
        settle(frame.id)?.resolve(frame.result);
        break;
      case 'refused':
        // A refusal that names no ask is of the notebook itself — not served, or not to be opened — or of something the
        // page sent that the server could not read.
        if (frame.id === 0) {
          fail(frame.message);
        } else {
          settle(frame.id)?.reject(new Error(frame.message));
        }

        break;
    }
  }

  function settle(id) {
    const each = pending.get(id);

    pending.delete(id);

    return each;
  }

  // Asks the notebook something, answered to this page alone: sent at once, the socket keeping the order asks come in,
  // and the notebook taking each in its turn.
  function ask(name, fields = {}) {
    if (socket?.readyState !== WebSocket.OPEN) {
      return Promise.reject(new Error('The page is not connected to the server just now; try again in a moment.'));
    }

    const id = ++asks;

    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      socket.send(JSON.stringify({ id, ask: name, ...fields }));
    });
  }

  const Waiting = 'Waits for the run under way to end…';

  // What the page says as its socket ends while the notebook holds changes not saved.
  const LostAtStop = 'What was not saved is lost if the server has stopped.';

  // What a button's run says while it waits for another notebook's C# run: it names no cell yet.
  const WaitsForCSharp = "Waits for another notebook's C# run to end…";

  // How many changes asked while a run was under way are not answered yet.
  let waiting = 0;

  // How many changes this page asked for are not answered yet: until each is, what it changes may not be in the file.
  let unanswered = 0;

  // A change to the notebook, asked at once: one asked while a cell runs is made once the run ends, and says so
  // meanwhile. What refuses it is said, unless the asker says it otherwise; nothing is asked once the notebook is closed.
  // Its answer, or nothing.
  async function request(name, fields, failed = error => fail(error.message)) {
    if (closed) {
      return undefined;
    }

    const waits = state.running !== null;

    unanswered++;

    if (waits) {
      waiting++;
      hold('waiting', Waiting);
    }

    try {
      return await ask(name, fields);
    } catch (error) {
      failed(error);

      return undefined;
    } finally {
      unanswered--;

      if (waits && --waiting === 0) {
        hold('waiting', null);
      }
    }
  }

  // Typing is sent as it is typed, as Verso's editor sends each change: the whole text, at once, before anything asked
  // after it, so a click acts on the text as the person left it; it then waits its turn at the notebook, not in the page.
  // Until every edit of a cell is answered, what the notebook tells of the cell is older than what the person has, and
  // writes over none of it. Text typed while the page has no socket, or sent on one that went before it was answered, is
  // kept, and sent once the page has a socket again: an edit carries the whole text, so one that arrives twice changes
  // nothing the second time. By cell: the text not sent yet; and how many edits are on their way, with the text the last
  // one carried.
  const typed = new Map();
  const sending = new Map();

  function flushTyping() {
    if (socket?.readyState === WebSocket.OPEN) {
      for (const [id, source] of typed) {
        typed.delete(id);
        sendTyped(id, source);
      }
    }

    markUnsent();
  }

  // A cell whose typing is kept, not sent yet, is marked so until it is sent.
  function markUnsent() {
    for (const section of cellSections()) {
      section.classList.toggle('unsent', typed.has(section.dataset.cellId));
    }
  }

  async function sendTyped(id, source) {
    const on = socket;

    sending.set(id, { count: (sending.get(id)?.count ?? 0) + 1, text: source });

    try {
      // A refusal is said; an edit the socket took with it when it went is kept, with what was typed since, to be sent
      // again — of a cell the notebook still holds.
      await request('edit', { cell: id, source }, error => {
        if (socket === on) {
          fail(error.message);
        } else if (state.cells.has(id)) {
          typed.set(id, sending.get(id).text);
          markUnsent();
        }
      });
    } finally {
      const { count, text } = sending.get(id);

      if (count > 1) {
        sending.set(id, { count: count - 1, text });
      } else {
        // Every edit of the cell answered: it shows what the notebook holds, unless there is more to send.
        sending.delete(id);

        const section = sectionOf(id);

        if (section) {
          fill(section, state.cells.get(id));
        }
      }
    }
  }

  // A page that goes closes its socket as it goes, what was typed having left as it was typed; shown again from the
  // browser's history, it opens one again.
  window.addEventListener('pagehide', () => {
    leaving = true;
    socket?.close(1000, 'the page left');
  });
  window.addEventListener('pageshow', event => {
    if (event.persisted && state.name && !closed) {
      leaving = false;
      connect();
    }
  });

  // ---- The notebooks of a folder --------------------------------------------------------------------------------

  async function list() {
    const [names, served] = await Promise.all([json('/api/notebooks'), json('/api/served')]);

    // A server beside one notebook shows it at once; a folder is listed even when it holds one, so a new one can be made.
    if (!served.folder && names.length === 1) {
      location.search = `?notebook=${encodeURIComponent(names[0])}`;

      return;
    }

    const items = document.createElement('ul');

    items.id = 'notebooks';

    for (const name of names) {
      const item = document.createElement('li');
      const link = document.createElement('a');

      link.href = `?notebook=${encodeURIComponent(name)}`;
      link.textContent = name;
      item.append(link);
      items.append(item);
    }

    main.replaceChildren(items, ...(served.folder ? [newForm()] : []));
    hold('empty', names.length === 0 ? 'There is no notebook here yet.' : null);
  }

  // A new notebook in the folder served, under the name of a .verso file; the server says why a name will not do.
  function newForm() {
    const form = document.createElement('form');
    const name = document.createElement('input');
    const make = document.createElement('button');

    form.id = 'new';
    name.name = 'name';
    name.placeholder = 'new.verso';
    name.required = true;
    make.type = 'submit';
    make.textContent = 'New notebook';
    form.append(name, make);
    form.addEventListener('submit', event => {
      event.preventDefault();

      const named = name.value.trim();

      api('/api/notebooks', { method: 'POST', body: { name: named } })
        .then(() => {
          location.search = `?notebook=${encodeURIComponent(named)}`;
        })
        .catch(error => fail(error.message));
    });

    return form;
  }

  // ---- A notebook ------------------------------------------------------------------------------------------------

  // A notebook, over its socket: the kinds a cell can be come with its first frame, before the first cell is drawn, since
  // they say which cells a person writes.
  function open(name) {
    state.name = name;
    document.title = `${name} — DeepSharp`;
    document.getElementById('notebook-name').textContent = name;
    saveButton.hidden = false;
    closeButton.hidden = false;
    connect();
  }

  // The notebook as its socket's first frame tells it, drawn onto what the page shows: a cell still there is drawn again
  // where it stands, so the text the person is in keeps its focus and what a cell shows is kept; one that went is taken
  // away, and one that came is drawn in its place.
  function drawAll(version) {
    state.cells.clear();
    state.allows = version.layout?.allows ?? 255;
    state.panel = version.layout?.hasPropertiesPanel ?? true;
    state.layoutId = version.layout?.id ?? null;
    state.buttons = version.buttons ?? [];
    drawAdding();
    drawToolbar();

    for (const cell of version.cells) {
      state.cells.set(cell.id, cell);
    }

    for (const section of cellSections()) {
      const cell = state.cells.get(section.dataset.cellId);

      if (cell) {
        fill(section, cell);
      }
    }

    state.arrangement = version.arrangement ?? null;
    state.metadata = version.metadata;
    arrange(version.cells.map(cell => cell.id));
    drawArrangement();

    showRunning(version.running, version.executing, version.kernels);
    showDocInfo();
    showUnsaved(version.unsaved);
    themeIs(version.themeId);
    drawPanels();
    drawCarried();
  }

  function apply(change) {
    for (const cell of change.cells) {
      state.cells.set(cell.id, cell);
    }

    // The buttons come with the version whenever one says something else: every bar is drawn from them.
    if (change.buttons) {
      state.buttons = change.buttons;
      drawToolbar();
    }

    if (change.order) {
      arrange(change.order);
    }

    for (const cell of change.cells) {
      const section = sectionOf(cell.id);

      if (section) {
        fill(section, cell);
      }
    }

    layoutIs(change.layout);

    // What the layout draws of its own comes whenever it draws something else than before.
    if (change.arrangement) {
      state.arrangement = change.arrangement;
      drawArrangement();
    }

    // What the notebook says of itself comes whenever it says something else than before.
    if (change.metadata) {
      state.metadata = change.metadata;
      showMetadata();
    }

    const restarts = state.kernels?.restarts ?? 0;

    showRunning(change.running, change.executing, change.kernels);
    showDocInfo();
    sayRestarted(restarts);
    showUnsaved(change.unsaved);
    themeIs(change.themeId);
    refreshPanelSoon();
    drawCarried();
  }

  // A layout switched while the page shows the notebook: every cell offers again what the new one allows.
  function layoutIs(layout) {
    const allows = layout?.allows ?? 255;
    const panelled = layout?.hasPropertiesPanel ?? true;
    const id = layout?.id ?? null;

    // As Verso's editor closes the properties panel on a layout that has none, and offers it again on one that does; and
    // the View panel shows which layout is the notebook's now.
    if (panelled !== state.panel || id !== state.layoutId) {
      state.panel = panelled;
      state.layoutId = id;
      drawPanels();
    }

    if (allows === state.allows) {
      return;
    }

    state.allows = allows;
    drawAdding();

    for (const section of cellSections()) {
      const cell = state.cells.get(section.dataset.cellId);

      if (cell) {
        fill(section, cell);
      }
    }
  }

  // The row under the last cell, a button for every kind a cell can be added as, where the layout lets one be added.
  function drawAdding() {
    adding.hidden = !state.name || !allowed(Allows.Insert);
    adding.replaceChildren(...(adding.hidden ? [] : state.kinds.map(kind => kindButton(kind, `+ ${kind.name}`, () => addCell(null, kind)))));
  }

  function kindButton(kind, label, pressed) {
    const button = document.createElement('button');

    button.type = 'button';
    button.dataset.type = kind.type;
    button.dataset.language = kind.language ?? '';
    button.textContent = label;
    button.addEventListener('click', event => {
      event.stopPropagation();
      pressed();
    });

    return button;
  }

  // Every cell the page draws, wherever it stands: in the list, or placed in a slot of what a layout draws of its own.
  const cellSections = () => document.querySelectorAll('section.cell');
  const sectionOf = id => document.querySelector(`section.cell[data-cell-id="${CSS.escape(id)}"]`);

  // While the page moves cells or takes them away: a text that loses its focus then was not left by the person.
  let redrawing = false;

  // The cells in the order the notebook holds them: a cell that went is taken away, one that came is drawn in its place,
  // and one already in its place stays where it is, so the text the person is in keeps its focus. While what the layout
  // draws of its own shows the notebook, that arrangement places the cells, and a cell that came waits in the list for it.
  // The chosen cell going — taken away here or in another tab — hands the choice to the cell a click put in its place,
  // else to the first, as Verso's editor chooses the first once its chosen cell is deleted.
  function arrange(order) {
    const was = state.order;
    const drawn = new Map([...cellSections()].map(section => [section.dataset.cellId, section]));
    const gone = state.selected !== null && !order.includes(state.selected);
    const inItsPlace = gone ? order[was.indexOf(state.selected)] : undefined;
    const next = inItsPlace !== undefined && !was.includes(inItsPlace) ? inItsPlace : order[0] ?? null;

    state.order = order;
    redrawing = true;

    try {
      for (const [id, section] of drawn) {
        if (!order.includes(id)) {
          section.remove();
          state.cells.delete(id);
        }
      }

      let before = null;

      for (const id of order) {
        const section = drawn.get(id) ?? fill(document.createElement('section'), state.cells.get(id));

        if (!arrangement.hidden) {
          if (!section.isConnected) {
            main.append(section);
          }

          continue;
        }

        if ((before ? before.nextElementSibling : main.firstElementChild) !== section) {
          if (before) {
            before.after(section);
          } else {
            main.prepend(section);
          }
        }

        before = section;
      }
    } finally {
      redrawing = false;
    }

    if (gone) {
      if (next === null) {
        deselect();
      } else {
        select(next);
      }
    }
  }

  // What the layout the notebook is shown in draws of its own — Verso's dashboard, its presentation — drawn as Verso's
  // editors draw it: the arrangement, each cell's element placed in the slot that names it, and the cells it shows no slot
  // for kept out of sight in the list. A layout that draws nothing of its own, the notebook's among them, is the page's
  // list; one that failed to draw is too, and the page says why. Every cell goes back to the list first, so a new
  // arrangement takes none away with the old one, and the list is in the notebook's order again when it shows. All of it
  // is done before the page is laid out again, so the page stays where it was scrolled to.
  function drawArrangement() {
    const html = state.arrangement?.html ?? null;

    redrawing = true;

    try {
      for (const section of arrangement.querySelectorAll('[data-cell-slot] > section.cell')) {
        main.append(section);
      }

      arrangement.innerHTML = html === null ? '' : DOMPurify.sanitize(html, sanitizing);
      arrangement.hidden = html === null;
      main.hidden = html !== null;

      for (const slot of arrangement.querySelectorAll('[data-cell-slot]')) {
        const section = sectionOf(slot.dataset.cellSlot);

        if (section) {
          slot.append(section);
        }
      }
    } finally {
      redrawing = false;
    }

    if (html === null) {
      arrange(state.order);
    } else {
      holdTiles();
    }

    if (state.arrangement?.fault) {
      fail(`The layout could not be drawn: ${state.arrangement.fault}`);
    }

    drawCarried();
  }

  // ---- Diagrams and formulas, drawn as Verso's editors draw them, from what the page carries ------------------------

  // A library the page carries, read the first time it is needed.
  const carried = id => JSON.parse(document.getElementById(id).textContent);

  let mermaidLoading = null;
  let katexLoading = null;
  let parked = null;

  // Run as Verso's own loader runs it: in a function whose define, exports and module stand in for whatever the page has
  // of its own, with the bundle's namespace linked to the page's global first, so Mermaid lands on window.mermaid.
  function loadMermaid() {
    mermaidLoading ??= Promise.resolve().then(() => {
      new Function('define', 'exports', 'module',
        '"use strict";var __esbuild_esm_mermaid_nm=(globalThis.__esbuild_esm_mermaid_nm=globalThis.__esbuild_esm_mermaid_nm||{});\n'
        + carried('carried-mermaid') + '\n//# sourceURL=mermaid.min.js')();
      window.mermaid.initialize({ startOnLoad: false, theme: 'default' });

      return window.mermaid;
    });

    return mermaidLoading;
  }

  // KaTeX runs the same way, landing on window.katex, and its stylesheet — its fonts written in — comes with it.
  function loadKatex() {
    katexLoading ??= Promise.resolve().then(() => {
      new Function('define', 'exports', 'module', carried('carried-katex') + '\n//# sourceURL=katex.min.js')();

      const faces = document.createElement('style');

      faces.id = 'katex-faces';
      faces.textContent = carried('carried-katex-css');
      document.head.append(faces);

      return window.katex;
    });

    return katexLoading;
  }

  // DOMPurify runs as the page starts, since every piece of HTML the page places passes it first: what a cell shows, what a
  // layout draws, a button's icon. Opening a notebook is not running it, and an output its file carries once ran as the
  // page itself — which holds the notebook's socket and can run its cells — from a handler on an element. What would run
  // is taken out: handlers, script addresses, scripts and frames; the rest is placed as it was written.
  new Function('define', 'exports', 'module', carried('carried-dompurify') + '\n//# sourceURL=purify.min.js')();

  const sanitizing = { FORCE_BODY: true };

  const hasBox = node => node.checkVisibility ? node.checkVisibility() : node.offsetParent !== null;

  // Every diagram and formula the cells show, drawn once each, and a library run only when one shows: a page with neither
  // never runs either. Mermaid measures a diagram's text where it stands, so one out of sight — in a cell a layout has not
  // placed, or a rendering hidden while its cell is written in — waits until it has a place on the page. A library that
  // fails is said.
  async function drawCarried() {
    try {
      if (document.querySelector('.outputs .mermaid:not([data-processed])')) {
        const mermaid = await loadMermaid();
        const ready = [];

        for (const node of document.querySelectorAll('.outputs .mermaid:not([data-processed])')) {
          if (hasBox(node)) {
            ready.push(node);
          } else {
            park(node);
          }
        }

        if (ready.length > 0) {
          await mermaid.run({ nodes: ready });
        }
      }

      if (document.querySelector('.outputs .math:not([data-katex-processed])')) {
        const katex = await loadKatex();

        // Asked only now, after the wait: a drawing that came meanwhile finds these marked, and typesets nothing twice.
        for (const node of document.querySelectorAll('.outputs .math:not([data-katex-processed])')) {
          node.setAttribute('data-katex-processed', 'true');

          const math = formula(node);

          try {
            katex.render(math.tex, node, { displayMode: math.display, throwOnError: false });
          } catch {
            // Some text KaTeX throws on all the same: what was written stays, which says the most.
          }
        }
      }
    } catch (error) {
      fail(`Diagrams or formulas could not be drawn: ${error.message}`);
    }
  }

  // Waits for a diagram to have a place on the page, and draws it then.
  function park(node) {
    parked ??= new ResizeObserver(entries => {
      const ready = [];

      for (const entry of entries) {
        if (!entry.target.isConnected || entry.target.hasAttribute('data-processed')) {
          parked.unobserve(entry.target);
        } else if (entry.contentRect.width > 0 && hasBox(entry.target)) {
          parked.unobserve(entry.target);
          ready.push(entry.target);
        }
      }

      if (ready.length > 0) {
        loadMermaid().then(mermaid => mermaid.run({ nodes: ready })).catch(error => fail(`Diagrams could not be drawn: ${error.message}`));
      }
    });
    parked.observe(node);
  }

  // The delimiters say which a formula is: \( \) in the line, \[ \] on a line of its own; with neither, the element
  // Markdown drew it as does.
  function formula(node) {
    const text = node.textContent.trim();

    if (text.startsWith('\\(') && text.endsWith('\\)')) {
      return { tex: text.slice(2, -2), display: false };
    }

    if (text.startsWith('\\[') && text.endsWith('\\]')) {
      return { tex: text.slice(2, -2), display: true };
    }

    return { tex: text, display: node.tagName === 'DIV' };
  }

  // ---- Verso's dashboard: a tile moved by its bar and resized by its corner, as Verso's own script does it --------

  // How high a row of the dashboard's grid is, as the grid lays it out.
  const TileRow = 50;

  // Where a tile is placed and how large it is, as the arrangement drew it, and where a new place goes: to the dashboard's
  // own part, which draws it there with the next version.
  const spanOf = (value, otherwise) => Number(/span\s+(\d+)/.exec(value)?.[1] ?? otherwise);
  const startOf = value => Number(/(\d+)/.exec(value)?.[1] ?? 1) - 1;

  function placeTile(tile, row, column, width, height) {
    const cell = tile.dataset.cellSlot;

    request('interact', { layout: state.layoutId, action: 'updateCellPosition', payload: JSON.stringify({ cellId: cell, row, col: column, width, height }), target: cell });
  }

  // The grid a tile stands in, measured as the dashboard measures it: a column is its share of the width, the gap to the
  // next one included.
  function gridOf(tile) {
    const grid = tile.closest('.verso-dashboard-grid');
    const style = getComputedStyle(grid);
    const gap = parseFloat(style.rowGap) || 8;
    const left = parseFloat(style.paddingLeft) || 24;

    return { grid, gap, left, top: parseFloat(style.paddingTop) || 16, column: (grid.clientWidth - left * 2 + gap) / 12, box: grid.getBoundingClientRect() };
  }

  // The dashboard's tiles, wherever an arrangement draws them.
  function holdTiles() {
    for (const tile of arrangement.querySelectorAll('.verso-dashboard-cell[data-cell-slot]')) {
      tile.querySelector('.verso-dashboard-drag-handle')?.addEventListener('mousedown', event => dragTile(event, tile));
      tile.querySelector('.verso-dashboard-resize-handle')?.addEventListener('mousedown', event => resizeTile(event, tile));
    }
  }

  // Held by the empty part of its bar — its buttons are pressed, not dragged — a tile moves with the pointer, and where its
  // top-left corner is let go is its new place, clamped to the grid.
  function dragTile(event, tile) {
    if (event.button !== 0 || event.target.closest('button')) {
      return;
    }

    event.preventDefault();

    const grid = gridOf(tile);
    const start = tile.getBoundingClientRect();
    const width = spanOf(tile.style.gridColumn, 6);
    const height = spanOf(tile.style.gridRow, 4);
    const ghost = element('div', 'tile-ghost');
    const place = element('div', 'tile-place');
    const at = moved => {
      const x = moved.clientX - (event.clientX - start.left) - grid.box.left - grid.left;
      const y = moved.clientY - (event.clientY - start.top) - grid.box.top - grid.top;

      return { row: Math.max(0, Math.floor(y / (TileRow + grid.gap))), column: Math.min(Math.max(0, Math.min(11, Math.floor(x / grid.column))), 12 - width) };
    };

    Object.assign(ghost.style, { left: `${start.left}px`, top: `${start.top}px`, width: `${start.width}px`, height: `${start.height}px` });
    Object.assign(place.style, { gridColumn: tile.style.gridColumn, gridRow: tile.style.gridRow });
    document.body.append(ghost);
    grid.grid.append(place);
    tile.classList.add('verso-dragging');

    const move = moved => {
      const target = at(moved);

      ghost.style.left = `${start.left + moved.clientX - event.clientX}px`;
      ghost.style.top = `${start.top + moved.clientY - event.clientY}px`;
      place.style.gridColumn = `${target.column + 1} / span ${width}`;
      place.style.gridRow = `${target.row + 1} / span ${height}`;
    };
    const up = released => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      tile.classList.remove('verso-dragging');
      ghost.remove();
      place.remove();

      const target = at(released);

      placeTile(tile, target.row, target.column, width, height);
    };

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  // Held by its corner, a tile grows and shrinks with the pointer, snapped to whole columns — one to twelve — and rows.
  function resizeTile(event, tile) {
    if (event.button !== 0) {
      return;
    }

    event.preventDefault();
    event.stopPropagation();

    const grid = gridOf(tile);
    const start = tile.getBoundingClientRect();
    const ghost = element('div', 'tile-ghost');
    const size = element('div', 'tile-size');
    const snapped = moved => ({
      width: Math.max(1, Math.min(12, Math.round((start.width + moved.clientX - event.clientX) / grid.column))),
      height: Math.max(1, Math.round((start.height + moved.clientY - event.clientY) / (TileRow + grid.gap))),
    });

    Object.assign(ghost.style, { left: `${start.left}px`, top: `${start.top}px`, width: `${start.width}px`, height: `${start.height}px` });
    document.body.append(ghost, size);
    tile.classList.add('verso-resizing');

    const move = moved => {
      const target = snapped(moved);
      const wide = target.width * grid.column - grid.gap;
      const high = target.height * (TileRow + grid.gap) - grid.gap;

      ghost.style.width = `${wide}px`;
      ghost.style.height = `${high}px`;
      size.textContent = `${target.width} × ${target.height}`;
      size.style.left = `${start.left + wide + 8}px`;
      size.style.top = `${start.top + high - 20}px`;
    };
    const up = released => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      tile.classList.remove('verso-resizing');
      ghost.remove();
      size.remove();

      const target = snapped(released);

      placeTile(tile, startOf(tile.style.gridRow), startOf(tile.style.gridColumn), target.width, target.height);
    };

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  // What a part keeps with a cell, written as JSON; a value JSON could not write is kept as its text.
  const metadata = (cell, key) => {
    const written = cell.metadata?.[key];

    if (written === undefined) {
      return undefined;
    }

    try {
      return JSON.parse(written);
    } catch {
      return written;
    }
  };

  // A count a part keeps with a cell, as Verso's editor reads one from a notebook's file: a whole number above nought, else
  // the default.
  const countOf = (cell, key, otherwise) => {
    const count = metadata(cell, key);

    return Number.isInteger(count) && count > 0 && count <= 2147483647 ? count : otherwise;
  };

  // How a cell's outputs are shown, as Verso's editor reads the part's word: cut short, hidden — either without regard to
  // case — or else in full.
  const visibilityOf = cell => {
    const word = metadata(cell, 'verso:ui.outputVisibility');
    const read = typeof word === 'string' ? word.toLowerCase() : '';

    return read === 'preview' || read === 'hidden' ? read : 'expanded';
  };

  // The part that keeps how a cell is shown, and a code cell's fold among it.
  const DisplayPart = 'verso.propertyprovider.display';
  const Folded = 'verso:ui.inputCollapsed';

  // As Verso's editor folds a cell's text: a code cell that is written, and only such a cell, folded while the part keeps
  // true for it.
  const foldable = cell => (kindOf(cell)?.editable ?? true) && cell.type.toLowerCase() === 'code';
  const foldedOf = cell => foldable(cell) && metadata(cell, Folded) === true;

  // A folded cell's text as Verso's editor shows it: its first lines that say something, trimmed at their ends, a mark
  // when there are more, and a word when there are none.
  function firstLines(source, count) {
    const lines = source.replace(/\r\n/g, '\n').split('\n').map(line => line.trimEnd()).filter(line => line.trim() !== '');

    if (lines.length === 0) {
      return '(empty)';
    }

    const shown = lines.slice(0, Math.max(1, count));

    return [...shown, ...(lines.length > shown.length ? ['...'] : [])].join('\n');
  }

  // A cell drawn as Verso's editors draw one: its text, what it shows, how it last ran.
  function fill(section, cell) {
    section.className = 'cell';
    section.dataset.cellId = cell.id;
    section.dataset.type = cell.type;
    section.classList.toggle('selected', chosen() === cell.id);
    section.classList.toggle('unsent', typed.has(cell.id));
    markRun(section);

    let bar = section.querySelector('.cell-bar');
    let source = section.querySelector('textarea.source');
    let lines = section.querySelector('.source-preview');
    let outputs = section.querySelector('.outputs');
    let summary = section.querySelector('.output-summary');
    let inserting = section.querySelector('.insert-row');

    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'cell-bar';
      source = document.createElement('textarea');
      source.className = 'source';
      source.spellcheck = false;

      // A folded cell's lines choose the cell on a click, as Verso's editor has them.
      lines = element('div', 'source-preview', [element('pre')]);
      lines.addEventListener('click', () => select(section.dataset.cellId));
      outputs = document.createElement('div');
      outputs.className = 'outputs';
      summary = element('div', 'output-summary');
      inserting = document.createElement('div');
      inserting.className = 'insert-row';

      const meaning = document.createElement('div');

      meaning.className = 'hover-line';
      meaning.setAttribute('aria-live', 'polite');
      section.replaceChildren(bar, source, lines, meaning, outputs, summary, inserting);
      listenTo(section, source);
    }

    drawBar(bar, cell);

    // Between this cell and the next, for the cell selected: a button for every kind a cell can be added as.
    inserting.replaceChildren(...(allowed(Allows.Insert) ? state.kinds.map(kind => kindButton(kind, `+ ${kind.name}`, () => addCell(cell.id, kind))) : []));

    // Text the person typed is theirs until the notebook has answered it: what it tells of the cell meanwhile is older,
    // and writes over none of it. The text is as high as what the person has.
    const text = typed.get(cell.id) ?? sending.get(cell.id)?.text ?? cell.source;

    if (source.value !== text) {
      source.value = text;
    }

    source.rows = Math.min(20, Math.max(2, text.split('\n').length));
    source.readOnly = !allowed(Allows.Edit);

    // As Verso's editors show a cell: a kind nobody writes shows no text; one shown rendered shows its text only while
    // it has none, has no output, or is selected; a folded one shows its first lines in its place.
    const written = kindOf(cell)?.editable ?? true;
    const preview = previewOf(cell);
    const folded = foldedOf(cell);

    source.hidden = !written || folded || preview;
    lines.hidden = !folded;
    lines.firstElementChild.textContent = folded ? firstLines(text, countOf(cell, 'verso:ui.inputPreviewLineCount', 2)) : '';

    // As Verso's editors do: a cell nobody writes that shows nothing yet is run once, so it draws itself — the
    // parameters form among them; once it shows something, clearing it draws it again.
    if (cell.outputs.length > 0) {
      state.drawn.delete(cell.id);
    } else if (!written && !state.drawn.has(cell.id) && state.running?.cell !== cell.id && allowed(Allows.Execute)) {
      state.drawn.add(cell.id);
      runCell(cell.id);
    }

    if (state.focus === cell.id && !source.hidden) {
      state.focus = null;
      requestAnimationFrame(() => source.focus());
    }

    // Where Verso's editor draws what a cell shows: always for a kind nobody writes; for another once it shows something —
    // for a kind shown rendered only in place of its text, never beside it. There, hidden outputs are said to be hidden.
    const visibility = visibilityOf(cell);
    const shows = !written || cell.outputs.length > 0 && (!renderedKind(cell) || preview);

    outputs.hidden = !shows || visibility === 'hidden';
    summary.hidden = !shows || visibility !== 'hidden';
    summary.textContent = summary.hidden ? '' : counted(cell.outputs.length, 'output hidden', 'outputs hidden');
    outputs.classList.toggle('preview', visibility === 'preview');
    outputs.style.setProperty('--lines', String(countOf(cell, 'verso:ui.outputPreviewLineCount', 5)));
    drawOutputs(outputs, cell.outputs);

    return section;
  }

  function drawBar(bar, cell) {
    const drawn = [];

    if (allowed(Allows.Execute)) {
      const run = barButton('run', '▶', RunSays, () => runCell(cell.id));

      canRun(run, cell.id);
      drawn.push(run);
    }

    // As Verso's editor folds a code cell's text: from a button of its own, the fold kept with the cell by the part that
    // keeps how a cell is shown.
    if (foldable(cell)) {
      const folded = foldedOf(cell);
      const fold = barButton('fold', '', folded ? 'Expand Code' : 'Collapse Code', () => request('property', { cell: cell.id, part: DisplayPart, field: 'inputCollapsed', value: !folded }));

      fold.setAttribute('aria-label', fold.title);
      fold.classList.toggle('folded', folded);
      fold.append(text('span', 'chevron', '▼'));
      drawn.push(fold);
    }

    drawn.push(allowed(Allows.Edit) ? kindSelect(cell) : kindName(cell));

    // As Verso's editor draws a cell's buttons: only those that can be pressed for the cell now.
    drawn.push(...state.buttons
      .filter(button => button.place === Place.Cell && !RunFromTheBar.has(button.id) && (button.enabledFor ?? []).includes(cell.id))
      .map(button => drawButton(button, [cell.id])));

    const status = document.createElement('span');

    status.className = 'status';
    // How a cell last ran is said as Verso's editor says it: not while it is shown rendered, and never for a cell nobody
    // writes, whose running mark is all it shows.
    status.textContent = previewOf(cell) || !(kindOf(cell)?.editable ?? true) ? '' : describeRun(cell);
    drawn.push(status);

    // As Verso's editors draw them: up for any but the first, down for any but the last, and delete.
    if (allowed(Allows.Reorder)) {
      drawn.push(barButton('up', '▲', 'Move the cell up, past the cell above it', () => moveCell(cell.id, true)));
      drawn.push(barButton('down', '▼', 'Move the cell down, past the cell below it', () => moveCell(cell.id, false)));
    }

    if (allowed(Allows.Delete)) {
      drawn.push(barButton('delete', '✕', 'Delete the cell', () => removeCell(cell.id)));
    }

    bar.replaceChildren(...drawn);
  }

  const RunSays = 'Run the cell (Shift+Enter)';

  // As Verso's editor offers a cell's run: not while a run is under way, which it would only queue behind, and saying why
  // when the run is another cell's.
  function canRun(run, id) {
    run.disabled = state.running !== null;
    run.title = state.running !== null && state.running.cell !== id ? `${RunSays}. Another cell is running.` : RunSays;
  }

  function barButton(name, mark, title, pressed) {
    const button = document.createElement('button');

    button.className = name;
    button.type = 'button';
    button.title = title;
    button.textContent = mark;
    button.addEventListener('click', event => {
      event.stopPropagation();
      pressed();
    });

    return button;
  }

  function kindName(cell) {
    const kind = document.createElement('span');

    kind.className = 'kind';
    kind.textContent = kindOf(cell)?.name ?? cell.language ?? cell.type;

    return kind;
  }

  // The cell's kind, and every kind it can be turned into; a kind the notebook does not list is shown as it is.
  function kindSelect(cell) {
    const select = document.createElement('select');
    const current = kindKey(cell.type, cell.language);

    select.className = 'kind';
    select.title = 'The kind of cell this is';
    select.append(...state.kinds.map(kind => new Option(kind.name, kindKey(kind.type, kind.language), false, kindKey(kind.type, kind.language) === current)));

    if (!kindOf(cell)) {
      const unlisted = new Option(cell.language ? `${cell.type} (${cell.language})` : cell.type, current, true, true);

      unlisted.disabled = true;
      select.prepend(unlisted);
    }

    select.addEventListener('click', event => event.stopPropagation());
    select.addEventListener('change', () => {
      const kind = state.kinds.find(each => kindKey(each.type, each.language) === select.value);

      if (kind) {
        changeKind(cell.id, kind);
      }
    });

    return select;
  }

  function describeRun(cell) {
    if (cell.executionCount == null) {
      return '';
    }

    const mark = cell.outputs.some(output => output.isError) || cell.lastStatus === 'Failed' ? '✘'
      : cell.lastStatus === 'Cancelled' ? '—' : '✔';

    return `${mark} ${seconds(cell.lastElapsed)} [${cell.executionCount}]`;
  }

  // A run's time as the server writes it — hours:minutes:seconds — said in seconds.
  function seconds(elapsed) {
    if (!elapsed) {
      return '';
    }

    const [hours, minutes, rest] = elapsed.split(':');
    const total = (Number(hours) * 3600) + (Number(minutes) * 60) + Number(rest);

    return total < 60 ? `${total.toFixed(1)}s` : `${(total / 60).toFixed(1)}m`;
  }

  // Which of a kernel's text streams an output came on, as the server's versions say it.
  const Stream = { Output: 0, Error: 1 };

  // What a cell shows, each drawn once and kept while it stays what it was — a widget's frame goes on running what it
  // runs — and drawn anew where it changed, as Verso's editor keeps each output by what it is and where it stands.
  function drawOutputs(container, outputs) {
    outputs.forEach((output, index) => {
      const drawn = container.children[index];

      if (drawn && sameOutput(drawn.drawnFrom, output)) {
        return;
      }

      const element = drawOutput(output);

      element.drawnFrom = output;

      if (drawn) {
        drawn.replaceWith(element);
      } else {
        container.append(element);
      }
    });

    while (container.children.length > outputs.length) {
      container.lastElementChild.remove();
    }
  }

  const sameOutput = (one, other) => !!one && one.contentType === other.contentType && one.content === other.content
    && one.isError === other.isError && one.errorName === other.errorName && one.errorStack === other.errorStack && one.stream === other.stream;

  // What a cell shows, drawn as Verso's editor draws it, in its order: a failure, progress, a widget, a diagram, HTML or
  // SVG, an image, JSON, a table, standard error, and text.
  function drawOutput(output) {
    const type = output.contentType;

    if (output.isError) {
      return element('div', 'error', [
        text('div', 'error-name', output.errorName ?? 'Error'),
        text('pre', 'error-content', output.content),
        ...(output.errorStack ? [text('pre', 'error-stack', output.errorStack)] : []),
      ]);
    }

    if (type === 'text/x-verso-progress') {
      return drawProgress(output.content);
    }

    if (type === 'text/x-verso-widget') {
      return drawWidget(output.content);
    }

    if (type === 'text/x-verso-mermaid') {
      return element('div', 'mermaid-container', [text('pre', 'mermaid', output.content)]);
    }

    if (type === 'text/html' || type === 'image/svg+xml') {
      const html = element('div', 'html');

      html.innerHTML = DOMPurify.sanitize(output.content, sanitizing);

      return html;
    }

    if (type.startsWith('image/')) {
      const image = document.createElement('img');

      image.src = `data:${type};base64,${output.content}`;
      image.alt = '';

      return element('div', 'html', [image]);
    }

    if (type === 'application/json') {
      return drawJson(output.content);
    }

    if (type === 'text/csv') {
      return drawCsv(output.content);
    }

    if (output.stream === Stream.Error) {
      const stderr = element('div', 'stderr', [text('div', 'stderr-label', 'stderr'), text('pre', null, output.content)]);

      stderr.setAttribute('role', 'note');
      stderr.setAttribute('aria-label', 'Standard error output');

      return stderr;
    }

    return text('pre', 'text', output.content);
  }

  function element(tag, name, children = []) {
    const made = document.createElement(tag);

    if (name) {
      made.className = name;
    }

    made.append(...children);

    return made;
  }

  function text(tag, name, words) {
    const made = element(tag, name);

    made.textContent = words;

    return made;
  }

  // Progress as one bar that advances: its activity and status said, the value moving silently; a bar of unknown length
  // when no share is given, full once done.
  function drawProgress(content) {
    let progress;

    try {
      progress = JSON.parse(content);
    } catch {
      progress = {};
    }

    const activity = typeof progress.activity === 'string' ? progress.activity : 'Working';
    const status = typeof progress.status === 'string' ? progress.status : null;
    const percent = progress.done === true ? 100
      : typeof progress.percent === 'number' ? Math.min(100, Math.max(0, Math.trunc(progress.percent))) : null;
    const fill = element('div', percent === null ? 'progress-fill unknown' : 'progress-fill');
    const track = element('div', 'progress-track', [fill]);

    if (percent !== null) {
      fill.style.width = `${percent}%`;
      track.setAttribute('aria-valuenow', String(percent));
    }

    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', activity);
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');

    return element('div', 'progress', [
      element('div', 'progress-label', [text('span', null, activity), ...(status ? [text('span', 'progress-status', status)] : [])]),
      track,
    ]);
  }

  // JSON as a tree, as Verso's editor draws it: open two levels deep, each object and list saying how much it holds, and
  // a number written as the JSON wrote it. What is not JSON is shown as it is.
  function drawJson(content) {
    let root;

    try {
      root = JSON.parse(content, (key, value, context) => typeof value === 'number' ? new Numeral(context?.source ?? String(value)) : value);
    } catch {
      return element('div', 'json', [text('pre', null, content)]);
    }

    return element('div', 'json', [drawJsonValue(root, null, 0)]);
  }

  // A number as the JSON wrote it, which no JSON value can be mistaken for.
  class Numeral {
    constructor(source) {
      this.source = source;
    }
  }

  const counted = (count, one, many) => `${count} ${count === 1 ? one : many}`;

  function drawJsonValue(value, key, depth) {
    const named = key === null ? [] : [text('span', 'jk', JSON.stringify(key)), ': '];
    const line = (...parts) => element('div', null, [...named, ...parts]);

    if (value === null) {
      return line(text('span', 'jnull', 'null'));
    }

    if (typeof value === 'string') {
      return line(text('span', 'js', JSON.stringify(value)));
    }

    if (typeof value === 'boolean') {
      return line(text('span', 'jb', String(value)));
    }

    if (value instanceof Numeral) {
      return line(text('span', 'jn', value.source));
    }

    const list = Array.isArray(value);
    const entries = list ? value.map(item => [null, item]) : Object.entries(value);
    const [open, close] = list ? ['[', ']'] : ['{', '}'];

    if (entries.length === 0) {
      return line(text('span', 'jbrace', open + close));
    }

    const details = element('details', null, [
      element('summary', null, [...named, text('span', 'jbrace', open), ' ', text('span', 'jcount', list ? counted(entries.length, 'item', 'items') : counted(entries.length, 'key', 'keys'))]),
      ...entries.map(([name, item]) => drawJsonValue(item, name, depth + 1)),
      element('div', null, [text('span', 'jbrace', close)]),
    ]);

    details.open = depth < 2;

    return details;
  }

  // A table of comma-separated values, as Verso's editor draws one: its first row the heading, a quoted field kept whole.
  function drawCsv(content) {
    const lines = content.split('\n').filter(line => line.length > 0);

    if (lines.length === 0) {
      return text('span', null, 'Empty CSV');
    }

    const table = element('table', 'csv', lines.map((line, index) =>
      element('tr', null, csvFields(line).map(field => text(index === 0 ? 'th' : 'td', null, field)))));

    return element('div', 'csv-frame', [table]);
  }

  function csvFields(line) {
    const fields = [];
    let field = '';
    let quoted = false;

    for (let at = 0; at < line.length; at++) {
      const character = line[at];

      if (quoted) {
        if (character === '"' && line[at + 1] === '"') {
          field += '"';
          at++;
        } else if (character === '"') {
          quoted = false;
        } else {
          field += character;
        }
      } else if (character === '"') {
        quoted = true;
      } else if (character === ',') {
        fields.push(field.trim());
        field = '';
      } else {
        field += character;
      }
    }

    fields.push(field.trim());

    return fields;
  }

  // ---- A widget: a whole document, in a frame of its own ------------------------------------------------------------

  // As Verso's editor frames one: the frame runs the document's code and reaches nothing of this page, starts small and
  // takes the height the document says it came to, or a fixed one when it never says. Nothing makes a widget answer in
  // this tool — no part it carries opens a way back — so it shows its saved state, and says so.
  const WidgetStart = 28;
  const WidgetUnsized = 420;
  const WidgetMost = 2000;

  // Written into the document ahead of it, so it runs first: a base a widget's loader can build addresses on; a
  // download the widget starts — which the frame may not — handed to this page instead; how tall the document came to;
  // and the theme, as this page gives it.
  const FrameScript = '<script>(' + String(function () {
    var Native = window.URL;

    function Forgiving(url, base) {
      try {
        return new Native(url, base);
      } catch (e) {
        return new Native(url, 'https://widget.invalid/');
      }
    }

    Forgiving.prototype = Native.prototype;
    ['createObjectURL', 'revokeObjectURL', 'canParse', 'parse'].forEach(function (name) {
      if (Native[name]) {
        Forgiving[name] = Native[name].bind(Native);
      }
    });
    window.URL = Forgiving;

    function saved(anchor) {
      var name = anchor && anchor.getAttribute && anchor.getAttribute('download');
      var href = anchor && anchor.href;

      return name && href && (href.indexOf('blob:') === 0 || href.indexOf('data:') === 0) ? { name: name, href: href } : null;
    }

    function handOut(request, otherwise) {
      fetch(request.href).then(function (response) {
        return response.blob();
      }).then(function (blob) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();

          reader.onload = function () { resolve({ type: blob.type, result: String(reader.result) }); };
          reader.onerror = function () { reject(reader.error); };
          reader.readAsDataURL(blob);
        });
      }).then(function (read) {
        var comma = read.result.indexOf(',');

        parent.postMessage({
          type: 'verso/widget-download',
          fileName: request.name,
          contentType: read.type || 'application/octet-stream',
          data: comma >= 0 ? read.result.slice(comma + 1) : read.result,
        }, '*');
      }).catch(function () {
        otherwise();
      });
    }

    var click = HTMLAnchorElement.prototype.click;
    var dispatch = HTMLAnchorElement.prototype.dispatchEvent;

    HTMLAnchorElement.prototype.click = function () {
      var request = saved(this);
      var anchor = this;
      var given = arguments;

      if (!request) {
        return click.apply(this, arguments);
      }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JS actions into Node 24 ahead of GitHub's forced migration, so an incompatibility surfaces on a day we
# can fix it rather than on the day the runner switches by itself.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The wiki's code is compiled by a test, as the README's is. GitHub keeps a wiki as a repository of its own, so it
      # is cloned beside this one, where it stands on a contributor's machine and where the test looks for it.
      - name: Clone the wiki beside the repository
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" ../DeepSharp.wiki

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both runtimes: every package ships a build for each, and every suite runs on each.
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore DeepSharp.slnx

      # The build treats every warning as the failure it has not become yet, so this step is the whole
      # zero-warning rule: there is nothing to read afterwards and nothing to forget to read.
      - name: Build
        run: dotnet build DeepSharp.slnx --no-restore --configuration Release

      # deepsharp-serve's page is tested in a real browser. On this runner that is Chromium, which Playwright installs
      # together with what it needs from the system; on Windows the tests use the Edge that is already there.
      - name: Install the browser the page is tested in
        shell: pwsh
        run: ./Tst/DeepSharp.Verso.Serve/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The test project is an executable: xunit v3 runs its suite from its own entry point, and `dotnet test`
      # starts a runner that finds nothing to do and exits cleanly having run zero tests. Measured on the first
      # commit here: 0% coverage over 0 executed tests. So the executable is run and the collector is wrapped
      # around it.
      #
      # 90% of lines and 90% of branches, per class and over the library as a whole. Below either number this
      # fails the build and names the classes that are short: a gate that reports and carries on is a report,
      # and a total has a denominator big enough to carry one untested class across the line.
      - name: Test with coverage
        shell: pwsh
        run: ./tools/coverage/run.ps1 -Check

      - name: Pack
        run: dotnet pack DeepSharp.slnx --no-build --configuration Release --output nupkgs

      - name: Keep the package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkgs/*.nupkg
          if-no-files-found: error

      # What a person runs is the package, not the build every suite ran: deepsharp-serve is installed from the package
      # just made and started in a folder of its own, in each way a person comes to run it. After the upload, so a
      # package this refuses can still be taken apart.
      - name: Start deepsharp-serve from its package
        timeout-minutes: 10
        run: bash tools/serve/check.sh nupkgs

      # Verso installs the notebook package into a folder of its own and loads it apart from everything else, so a
      # dependency the package does not declare is missing there while every suite, which runs the build, finds it. The
      # package just made is installed by Verso's own installer and loaded by its own loader, in a host holding nothing of
      # DeepSharp, and a notebook is run in it — on .NET 8, and on the newest runtime, as Verso's VS Code extension runs.
      - name: Install the notebook from its package as Verso installs it
        timeout-minutes: 10
        run: bash tools/verso/check.sh nupkgs

      # An application referencing DeepSharp.Backends.TorchSharp from the package just made, and nothing of DeepSharp's
      # source, finds what that package alone gives it: refused by name where it brings no libtorch, and a real step of
      # the networks sample's Titanic pipeline where it brings the processor's.
      - name: Check DeepSharp.Backends.TorchSharp from its package
        timeout-minutes: 10
        run: bash tools/torch/check.sh nupkgs

      # The two halves of the ML.NET learner from the packages just made: the one that trains fits a tree of the Titanic
      # pipeline and writes it beside its pipeline as one file, and the one that only declares and reads takes that file
      # back while carrying nothing of ML.NET at all.
      - name: Check the ML.NET learner from its packages
        timeout-minutes: 10
        run: bash tools/ml/check.sh nupkgs

  # The ML.NET learner's own suite, which carries that library's native side, on Windows as well as the ubuntu run the
  # coverage gate already gives it: a trainer's native code is reached on both the platforms a person trains on.
  ml-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Run the ML.NET learner suite
        shell: bash
        run: |
          for framework in net8.0 net10.0; do
            dotnet run --project Tst/DeepSharp.Learners.MLNet/DeepSharp.Learners.MLNet.Tests.csproj --configuration Release --framework "$framework" || exit 1
          done

  # The engine's own suite, on libtorch, proven on both the platforms a person runs it on: the packages it references
  # for the processor's libtorch differ by platform, and native interop the suite's own run above never leaves
  # untried on Windows.
  torch-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Run the TorchSharp backend suite
        shell: bash
        run: |
          for framework in net8.0 net10.0; do
            dotnet run --project Tst/DeepSharp.Backends.TorchSharp/DeepSharp.Backends.TorchSharp.Tests.csproj --configuration Release --framework "$framework" || exit 1
          done

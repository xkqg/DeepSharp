name: Create Release

# A tag is the whole trigger. Both spellings are accepted because both get typed: v0.1.0 and 0.1.0.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  # To start publish.yml for the release this makes: see the last step.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The notes are the changelog section for this version, not a list of commit subjects: the changelog is
      # written for a reader and the commit log is written for the next maintainer.
      - name: Take the notes from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          awk -v v="## [$VERSION]" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release already exists; leaving it alone."
            echo "made=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" \
              --title "DeepSharp ${{ steps.notes.outputs.version }}" \
              --notes-file notes.md
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi

      # A release this workflow makes carries the bot as its author, and GitHub starts no workflow from an event the
      # bot's own token raised, but for a dispatch: 0.1.0, 0.2.0 and 0.3.0 each reached NuGet only once somebody
      # started the publish by hand. So the release starts it, for the tag. A release a person made starts it through
      # its own event, and is not dispatched a second time.
      - name: Publish the release to NuGet
        if: steps.release.outputs.made == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh workflow run publish.yml --ref "$TAG" -f tag="$TAG"

name: Publish to NuGet

on:
  release:
    types: [published]
  # A release a person makes starts this through the event above. One that release.yml makes carries the bot as its
  # author, and GitHub starts no workflow from an event the bot's own token raised, but for a dispatch: so release.yml
  # dispatches this for the tag. By hand, the dispatch is the way back in for a tag whose packages never went out.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish from (for example v0.1.0).'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets this job ask GitHub for a signed token saying which repository and which workflow file is
      # running. nuget.org checks that against the trusted-publishing policy and hands back a key that lives
      # for an hour. No long-lived secret exists in this repository, so there is none to leak and none to
      # rotate -- and a fork cannot publish, because the token names the repository it came from.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The wiki's code is compiled by a test, as the README's is. GitHub keeps a wiki as a repository of its own, so it
      # is cloned beside this one, where it stands on a contributor's machine and where the test looks for it.
      - name: Clone the wiki beside the repository
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" ../DeepSharp.wiki

      # A tag publishes, and a package on NuGet cannot be taken back: a tag naming another version than the build
      # declares would put that build's packages on NuGet under a release that says otherwise.
      - name: The tag names the version the packages carry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "${tag#v}" = "$declared" || { echo "The tag $tag names another version than the build declares, $declared"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Both runtimes: every package ships a build for each, and every suite runs on each.
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore DeepSharp.slnx

      - name: Build
        run: dotnet build DeepSharp.slnx --no-restore --configuration Release

      # deepsharp-serve's page is tested in a real browser. On this runner that is Chromium, which Playwright installs
      # together with what it needs from the system; on Windows the tests use the Edge that is already there.
      - name: Install the browser the page is tested in
        shell: pwsh
        run: ./Tst/DeepSharp.Verso.Serve/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Every suite runs on the exact commit being published. A release is the one moment where "it was green
      # yesterday" is not an answer. The suites are found by the name every suite has, so one added later is
      # never left out.
      - name: Test
        run: |
          for suite in Tst/*/*.Tests.csproj; do
            for framework in net8.0 net10.0; do
              dotnet run --project "$suite" --configuration Release --no-build --framework "$framework" || exit 1
            done
          done

      - name: Pack
        run: dotnet pack DeepSharp.slnx --no-build --configuration Release --output nupkgs

      # What a person runs is the package, not the build every suite ran: deepsharp-serve is installed from the package
      # about to be pushed and started in a folder of its own, in each way a person comes to run it.
      - name: Start deepsharp-serve from its package
        timeout-minutes: 10
        run: bash tools/serve/check.sh nupkgs

      # Verso installs the notebook package into a folder of its own and loads it apart from everything else: the package
      # about to be pushed is installed by Verso's own installer and a notebook is run in it, on .NET 8 and on the newest
      # runtime, before it leaves.
      - name: Install the notebook from its package as Verso installs it
        timeout-minutes: 10
        run: bash tools/verso/check.sh nupkgs

      # An application referencing DeepSharp.Backends.TorchSharp from the package about to be pushed, and nothing of
      # DeepSharp's source, finds what that package alone gives it: refused by name where it brings no libtorch, and a
      # real step of the networks sample's Titanic pipeline where it brings the processor's.
      - name: Check DeepSharp.Backends.TorchSharp from its package
        timeout-minutes: 10
        run: bash tools/torch/check.sh nupkgs

      # The key this returns is valid for one hour, so it is asked for here rather than at the top of the job.
      # `user` is the nuget.org profile name that owns the trusted-publishing policy — not an email address,
      # and not a secret.
      - name: Ask nuget.org for a short-lived key
        id: login
        uses: NuGet/login@v1
        with:
          user: RikkieG

      # Count first, then push, and check each push where it happens. A loop that pushes nothing exits just
      # as happily as one that pushed everything -- measured on the sister repository, where a green publish
      # step and a missing package looked identical from the outside. And more than none is not enough: every
      # project in Src is a package, and a pack that skipped one -- the web SDK packs nothing unless told to --
      # still pushes the others.
      - name: Push to NuGet
        run: |
          count=$(ls nupkgs/*.nupkg 2>/dev/null | wc -l)
          expected=$(ls Src/*/*.csproj | wc -l)
          echo "Pushing $count package(s), one for each of the $expected projects in Src"
          test "$count" -eq "$expected" || { echo "Pack made $count package(s) for $expected projects in Src"; exit 1; }
          for pkg in nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

version: 2

# A dependency that was safe when it was pinned does not stay safe, and nobody notices a CVE in a transitive
# package by reading the build log. These two ecosystems are everything this repository pulls in.
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # The notebook package is compiled against the oldest abstractions that carry what it calls, because Verso
      # refuses an extension compiled against a newer minor than the one it runs. Raising that floor decides who can
      # still load the package, so it is a decision rather than an update, and the notebook's tests refuse it.
      - dependency-name: "Verso.Abstractions"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps(ci)"
